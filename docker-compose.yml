services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: valnia-backend:latest
    container_name: valnia-backend
    ports:
      - "8081:8080"
    environment:
      - PORT=8080
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: valnia-frontend:latest
    container_name: valnia-frontend
    ports:
      - "8080:8080"
    environment:
      - BACKEND_URL=http://backend:8080
    depends_on:
      - backend
    restart: unless-stopped
