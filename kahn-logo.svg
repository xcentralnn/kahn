  <path d="M 128 36 L 58 52 L 50 66 L 50 132 C 50 174 86 206 128 222 Z" fill="url(#facetLeft)" />
  <path d="M 128 36 L 198 52 L 206 66 L 206 132 C 206 174 170 206 128 222 Z" fill="url(#facetRight)" />
  <line x1="128" y1="36" x2="128" y2="222" stroke="#2dd4bf" stroke-width="1" opacity="0.25" />

  <path d="M 128 34 L 196 50 C 168 62 148 70 128 70 C 108 70 88 62 60 50 Z" fill="url(#topGleam)" />

  <g stroke="#06b6d4" stroke-width="1" opacity="0.32" fill="none">
    <path d="M 62 98 L 94 98 L 106 110" />
    <path d="M 194 98 L 162 98 L 150 110" />
    <path d="M 62 164 L 94 164 L 106 152" />
    <path d="M 194 164 L 162 164 L 150 152" />
    <circle cx="62" cy="98" r="2" fill="#06b6d4" />
    <circle cx="194" cy="98" r="2" fill="#06b6d4" />
    <circle cx="62" cy="164" r="2" fill="#06b6d4" />
    <circle cx="194" cy="164" r="2" fill="#06b6d4" />
  </g>

  <g id="k-monogram">
    <path d="M 82 82
             L 94 72
             L 104 72
             L 104 184
             L 94 184
             L 82 174 Z"
