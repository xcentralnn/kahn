    <path d="M 116 120
             L 156 74
             L 178 74
             L 178 86
             L 138 128
             L 126 128 Z"
          fill="url(#wingUpperGrad)" />

    <path d="M 126 128
             L 138 128
             L 178 170
             L 178 182
             L 156 182
             L 116 136 Z"
          fill="url(#wingLowerGrad)" />

    <circle cx="122" cy="128" r="16" fill="url(#nexusBloom)" filter="url(#coreGlow)" />
    <polygon points="122,116 134,128 122,140 110,128" fill="#ffffff" />
    <circle cx="122" cy="128" r="3.5" fill="#0f172a" />
    <circle cx="122" cy="128" r="1.5" fill="#5eead4" />
