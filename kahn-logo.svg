<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="100%" height="100%">
  <defs>
    <radialGradient id="ambientGlow" cx="50%" cy="46%" r="55%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.28" />
      <stop offset="60%" stop-color="#14b8a6" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#070b12" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="nexusBloom" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95" />
      <stop offset="35%" stop-color="#5eead4" stop-opacity="0.8" />
      <stop offset="70%" stop-color="#06b6d4" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="shieldBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="35%" stop-color="#2dd4bf" />
      <stop offset="75%" stop-color="#0e7490" />
      <stop offset="100%" stop-color="#14b8a6" />
    </linearGradient>

    <linearGradient id="facetLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a192f" />
      <stop offset="50%" stop-color="#071526" />
      <stop offset="100%" stop-color="#030914" />
    </linearGradient>

    <linearGradient id="facetRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c2338" />
      <stop offset="50%" stop-color="#091c2e" />
      <stop offset="100%" stop-color="#040d18" />
    </linearGradient>

    <linearGradient id="pillarGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7dd3fc" />
      <stop offset="30%" stop-color="#38bdf8" />
      <stop offset="70%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#0d9488" />
    </linearGradient>

    <linearGradient id="wingUpperGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="45%" stop-color="#2dd4bf" />
      <stop offset="100%" stop-color="#a7f3d0" />
    </linearGradient>

    <linearGradient id="wingLowerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14b8a6" />
      <stop offset="55%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>

    <linearGradient id="topGleam" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#5eead4" stop-opacity="0" />
    </linearGradient>

    <filter id="coreGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <rect width="256" height="256" rx="48" fill="#070b12" />
  <circle cx="128" cy="124" r="96" fill="url(#ambientGlow)" />

  <path d="M 32 52 L 24 52 L 24 72" fill="none" stroke="#14b8a6" stroke-width="1.5" stroke-linecap="round" opacity="0.45" />
  <path d="M 224 52 L 232 52 L 232 72" fill="none" stroke="#14b8a6" stroke-width="1.5" stroke-linecap="round" opacity="0.45" />
  <path d="M 32 204 L 24 204 L 24 184" fill="none" stroke="#0ea5e9" stroke-width="1.5" stroke-linecap="round" opacity="0.45" />
  <path d="M 224 204 L 232 204 L 232 184" fill="none" stroke="#0ea5e9" stroke-width="1.5" stroke-linecap="round" opacity="0.45" />

  <path d="M 128 26
