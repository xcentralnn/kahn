name: Build ARM & Deploy to GCP

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  GCP_REGION: ${{ vars.GCP_REGION || 'asia-southeast1' }}
  GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID || 'valnia-dev-88' }}
  GCP_ARTIFACT_REPO: ${{ vars.GCP_ARTIFACT_REPO || 'valnia' }}

jobs:
  build-and-push:
    name: Build ARM Images
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud via WIF
        id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER || 'projects/12704697717/locations/global/workloadIdentityPools/valnia-github-pool/providers/valnia-github-provider' }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT || 'valnia-cicd-sa@valnia-dev-88.iam.gserviceaccount.com' }}
          token_format: access_token

      - name: Login to Google Artifact Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.GCP_REGION }}-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and Push Backend Image (linux/arm64)
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          platforms: linux/arm64
          push: true
          tags: |
            ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.GCP_ARTIFACT_REPO }}/valnia-backend:${{ github.sha }}
            ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.GCP_ARTIFACT_REPO }}/valnia-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and Push Frontend Image (linux/arm64)
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          platforms: linux/arm64
          push: true
          tags: |
            ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.GCP_ARTIFACT_REPO }}/valnia-frontend:${{ github.sha }}
            ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.GCP_ARTIFACT_REPO }}/valnia-frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Cloud Run
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Authenticate to Google Cloud via WIF
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER || 'projects/12704697717/locations/global/workloadIdentityPools/valnia-github-pool/providers/valnia-github-provider' }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT || 'valnia-cicd-sa@valnia-dev-88.iam.gserviceaccount.com' }}

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v3

      - name: Deploy Backend to Cloud Run
        id: deploy_backend
        uses: google-github-actions/deploy-cloudrun@v3
        with:
          service: valnia-be
          region: ${{ env.GCP_REGION }}
          image: ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.GCP_ARTIFACT_REPO }}/valnia-backend:${{ github.sha }}

      - name: Deploy Frontend to Cloud Run
        id: deploy_frontend
        uses: google-github-actions/deploy-cloudrun@v3
        with:
          service: valnia-fe
          region: ${{ env.GCP_REGION }}
          image: ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.GCP_ARTIFACT_REPO }}/valnia-frontend:${{ github.sha }}
          env_vars: |
            BACKEND_URL=${{ steps.deploy_backend.outputs.url }}

      - name: Deployment Summary
        run: |
          echo "### Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Frontend URL:** ${{ steps.deploy_frontend.outputs.url }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Backend URL:** ${{ steps.deploy_backend.outputs.url }}" >> $GITHUB_STEP_SUMMARY
